[package]
name = "ddbg"
version.workspace = true
edition.workspace = true
description = "A terminal-first, language-agnostic debugger built on the Debug Adapter Protocol"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"

[dependencies]
ddbg-cli.workspace = true
