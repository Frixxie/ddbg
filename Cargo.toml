[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
ddbg-dap = { path = "crates/ddbg-dap" }
ddbg-core = { path = "crates/ddbg-core" }
ddbg-cli = { path = "crates/ddbg-cli" }
ddbg-project = { path = "crates/ddbg-project" }

anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
reedline = { version = "0.52", features = ["external_printer"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "6"

[package]
name = "ddbg"
version.workspace = true
edition.workspace = true

[dependencies]
ddbg-cli.workspace = true
anyhow.workspace = true
tokio.workspace = true
