[workspace]
members = ["lib/*", "bin/*"]
exclude = ["fixtures"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
ddbg-dap = { path = "lib/ddbg-dap" }
ddbg-core = { path = "lib/ddbg-core" }
ddbg-cli = { path = "lib/ddbg-cli" }
ddbg-project = { path = "lib/ddbg-project" }
ddbg-test = { path = "lib/ddbg-test" }
ddbg-tui = { path = "lib/ddbg-tui" }

anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
ratatui = "0.30"
reedline = { version = "0.52", features = ["external_printer"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "6"
